[package]
name = "kis-radar"
version = "0.1.0"
edition = "2021"

[lib]
name = "kis_radar"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# 라이브 수집기(데몬 바이너리) — KIS 어댑터로 거래대금 랭킹 + 투자자 가집계 폴링.
collector = ["dep:kis-adapter", "dep:tokio", "dep:serde_json"]
# PyO3 바인딩 — 순수 엔진 analyze()만 노출(어댑터·tokio 불필요, 빌드 가벼움).
python = ["dep:pyo3", "dep:serde_json"]
# 일별 횡단면 엣지 체크 — KRX 전종목 데이터(어댑터 external) + 날짜 계산(chrono).
edgecheck = ["dep:kis-adapter", "kis-adapter/external", "dep:tokio", "dep:chrono"]

# 수집기 데몬 — collector feature 필요(어댑터+tokio 런타임).
[[bin]]
name = "collector"
required-features = ["collector"]

# 엣지 체크 — go/no-go. edgecheck feature 필요.
[[bin]]
name = "edge_check"
required-features = ["edgecheck"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
serde_json = { version = "1", optional = true }
kis-adapter = { path = "../../../korea-stock", optional = true }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "time"] }
pyo3 = { version = "0.28", optional = true, features = ["extension-module"] }
chrono = { version = "0.4", optional = true }

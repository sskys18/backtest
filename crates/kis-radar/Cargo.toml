[package]
name = "kis-radar"
version = "0.1.0"
edition = "2021"

[lib]
name = "kis_radar"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# 라이브 수집기(데몬 바이너리) — KIS 어댑터로 거래대금 랭킹 + 투자자 가집계 폴링.
collector = ["dep:kis-adapter", "dep:tokio", "dep:serde_json"]
# PyO3 바인딩 — 순수 엔진 analyze()만 노출(어댑터·tokio 불필요, 빌드 가벼움).
python = ["dep:pyo3", "dep:serde_json"]
# 일별 횡단면 엣지 체크 — KRX 전종목 데이터(어댑터 external) + 날짜 계산(chrono).
edgecheck = ["dep:kis-adapter", "kis-adapter/external", "dep:tokio", "dep:chrono"]

# 수집기 데몬 — collector feature 필요(어댑터+tokio 런타임).
[[bin]]
name = "collector"
required-features = ["collector"]

# 엣지 체크 — go/no-go. edgecheck feature 필요.
[[bin]]
name = "edge_check"
required-features = ["edgecheck"]

# 글로벌 반도체 -> KR 테크 lead/lag — gap vs intra vs fwd 분해. edgecheck feature 필요.
[[bin]]
name = "leadlag"
required-features = ["edgecheck"]

# 하루텀 swing(1~수일 HOLD) 일봉 신호 검증 — 삼전·하닉, edge-over-buy-hold + OOS. edgecheck feature 필요.
[[bin]]
name = "swing_check"
required-features = ["edgecheck"]

# 포지셔널 스마트머니 누적 → forward 아웃퍼폼 검증. edgecheck feature 필요.
[[bin]]
name = "positional_check"
required-features = ["edgecheck"]

# 단타 인트라데이 타이밍 신호 검증 — 삼전·하닉 1분봉. edgecheck feature 필요.
[[bin]]
name = "daytrade_check"
required-features = ["edgecheck"]

# 추세 오버레이 vs 매수보유 — 타이밍이 보유를 이기는가. edgecheck feature 필요.
[[bin]]
name = "trend_overlay"
required-features = ["edgecheck"]

# 인트라데이 회전+velocity 진단/검증 — 분봉. edgecheck feature 필요.
[[bin]]
name = "intraday_check"
required-features = ["edgecheck"]

# 기간 수익률+breadth. edgecheck feature 필요.
[[bin]]
name = "gainers"
required-features = ["edgecheck"]

# 드라이버 모니터링 대시보드 — 삼전·하닉의 KRX 현물·수급, Binance KR-perp,
# 글로벌 반도체를 한 화면에. 의사결정 보조용(매수/매도 신호 아님). edgecheck feature 필요.
[[bin]]
name = "dashboard"
required-features = ["edgecheck"]

# MACRO/exogenous → directional LONG/SHORT/FLAT 검증 — 삼전·하닉, 양다리(현물 롱 + perp 숏 프록시),
# OOS train(2022-23 bear)/test(2024-26 supercycle), short-funding 포함. edgecheck feature 필요.
[[bin]]
name = "macro_signal"
required-features = ["edgecheck"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
serde_json = { version = "1", optional = true }
kis-adapter = { package = "korea-stock", path = "../../../korea-stock", optional = true }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "time"] }
pyo3 = { version = "0.28", optional = true, features = ["extension-module"] }
chrono = { version = "0.4", optional = true }

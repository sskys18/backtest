strategy:
  name: momentum
  params:
    fast_period: 12
    slow_period: 26
    position_size: 0.15

backtest:
  pair: "BTC-USDT"
  timeframe: "1h"
  initial_capital: 10000.0
  data_path: "data/features/BTC-USDT-1h.parquet"

broker:
  slippage_bps: 5.0
  fee_rate: 0.001
  fill_model: "next_bar"

risk:
  max_position_size: 0.20
  max_drawdown_halt: 0.15
  signal_threshold: 0.5
